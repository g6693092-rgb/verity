apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "verity.fullname" . }}-backend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: { app: {{ include "verity.fullname" . }}-backend }
  template:
    metadata:
      labels: { app: {{ include "verity.fullname" . }}-backend }
    spec:
      containers:
        - name: backend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: 3000 }]
          envFrom: [{ secretRef: { name: verity-secrets } }]
          env:
            - { name: NODE_ENV, value: production }
            - { name: PORT, value: "3000" }
            - { name: REDIS_URL, value: redis://redis:6379 }
          resources:
{{ toYaml .Values.resources.backend | indent 12 }}
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 15, periodSeconds: 20 }
          readinessProbe: { httpGet: { path: /readyz, port: http }, initialDelaySeconds: 5, periodSeconds: 10 }
