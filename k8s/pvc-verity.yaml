apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: verity-data
  namespace: verity
  labels:
    app.kubernetes.io/name: verity
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 20Gi
  # Set this to an RWX-capable StorageClass in the target cluster.
  # storageClassName: efs-sc
