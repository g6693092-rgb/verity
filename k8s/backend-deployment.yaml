apiVersion: apps/v1
kind: Deployment
metadata:
  name: verity-backend
  namespace: verity
spec:
  replicas: 2
  selector:
    matchLabels: { app: verity-backend }
  template:
    metadata:
      labels: { app: verity-backend }
    spec:
      containers:
        - name: backend
          image: 0x.../verity-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - { name: NODE_ENV, value: production }
            - { name: PORT, value: "3000" }
            - { name: REDIS_URL, value: redis://redis:6379 }
          envFrom:
            - secretRef: { name: verity-secrets }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: verity-backend
  namespace: verity
spec:
  selector: { app: verity-backend }
  ports:
    - port: 3000
      targetPort: http
