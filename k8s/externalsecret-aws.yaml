apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets
  namespace: verity
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: verity-secrets
  namespace: verity
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets
    kind: SecretStore
  target:
    name: verity-secrets
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: prod/verity/jwt_secret
    - secretKey: DEPLOYER_PRIVATE_KEY
      remoteRef:
        key: prod/verity/deployer_private_key
    - secretKey: VECHAIN_MAINNET_RPC
      remoteRef:
        key: prod/verity/vechain_mainnet_rpc
