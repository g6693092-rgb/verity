apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: verity-secrets
  namespace: verity
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: verity-secret-store
    kind: ClusterSecretStore
  target:
    name: verity-secrets
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: verity/production
        property: JWT_SECRET
    - secretKey: DEPLOYER_PRIVATE_KEY
      remoteRef:
        key: verity/production
        property: DEPLOYER_PRIVATE_KEY
    - secretKey: ROOT_REGISTRY
      remoteRef:
        key: verity/production
        property: ROOT_REGISTRY
