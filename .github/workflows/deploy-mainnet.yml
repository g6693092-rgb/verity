name: Deploy RootRegistry mainnet

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_COLOR: 1

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm exec jest --runInBand
      - name: Deploy RootRegistry
        env:
          VECHAIN_MAINNET_RPC: ${{ secrets.VECHAIN_MAINNET_RPC }}
          DEPLOYER_PRIVATE_KEY_MAINNET: ${{ secrets.DEPLOYER_PRIVATE_KEY_MAINNET }}
        run: pnpm deploy:rootregistry:mainnet
      - name: Upload deployment record
        uses: actions/upload-artifact@v4
        with:
          name: rootregistry-mainnet
          path: deploy/rootregistry.json
