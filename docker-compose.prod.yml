services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_URL: redis://redis:6379
      DATA_DIR: /app/data
      PTAU_FILE: /app/ptau/pot12_final.ptau
      VECHAIN_TESTNET_RPC: ${VECHAIN_TESTNET_RPC}
      ROOT_REGISTRY: ${ROOT_REGISTRY}
    ports:
      - "3000:3000"
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node", "dist/queue/worker.js"]
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      DATA_DIR: /app/data
      PTAU_FILE: /app/ptau/pot12_final.ptau
      PROOF_WORKER_CONCURRENCY: ${PROOF_WORKER_CONCURRENCY:-1}
    depends_on:
      - redis

volumes:
  redis-data:
